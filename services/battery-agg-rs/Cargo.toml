[package]
name = "battery-agg-rs"
version = "0.1.0"
edition = "2021"
description = "Battery telemetry 5-minute window aggregation (Rust port of legacy Spark job). Synthetic demo."

[dependencies]
rdkafka = { version = "0.36", default-features = false, features = ["cmake-build", "libz"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
futures = { version = "0.3", default-features = false, features = ["executor"] }

[profile.release]
debug = false
