asyncapi: 2.6.0
info:
  title: Battery telemetry aggregation (synthetic demo)
  version: 1.0.0
  description: >
    Consumers of telemetry.battery-window-agg.v1 MUST read with isolation.level=read_committed.
    Exactly one record per (vin, window_start_ms); per-VIN order by window_start_ms.
channels:
  telemetry.battery.v1:
    publish: { message: { payload: { $ref: 'battery_telemetry.v1.json' } } }
    bindings: { kafka: { partitions: 6, key: vin } }
  telemetry.battery-window-agg.v1:
    subscribe: { message: { payload: { $ref: 'battery_window_agg.v1.json' } } }
    bindings: { kafka: { partitions: 6, key: vin } }
  telemetry.battery-window-agg.v1.shadow:
    description: Shadow output during migration; same schema; no production consumers.
  telemetry.battery.dlq.v1:
    description: Unparseable inputs. No location, no raw VIN (privacy rule P3). Retention 3 days.
  battery-agg-rs.changelog:
    description: Compacted, transactional per-partition state snapshots (internal).
